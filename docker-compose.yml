services:
  api_express:
    container_name: api-express
    image: lincenying/api-express:${TAG}
    build:
      context: .
      dockerfile: ./Dockerfile
    environment:
      DATABASE_URL: mongodb://db_mongo:27017
    env_file:
      - .env
    ports:
      - 4000:4000
    depends_on:
      - db_mongo
    networks:
      - webnet

  db_mongo:
    container_name: db-mongo-api-express
    image: mongo:4.0
    volumes:
      - ${MONGO_DIR:-./data/mongodb}:/data/db
    ports:
      - 27017:27017
    networks:
      - webnet

networks:
  webnet:
    driver: bridge
