# 控制是否以及如何将依赖项添加到默认目录中
catalogMode: prefer

# 是否忽略向工作区根目录添加依赖时的警告提示
ignoreWorkspaceRootCheck: true

# npm 包注册表的基本 URL（包括尾部斜杠）
registry: https://registry.npmmirror.com/
registries:
  default: https://registry.npmmirror.com/

# 定义了版本发布后 pnpm 安装之前必须经过的最少分钟数
minimumReleaseAge: 0

# 是否强制提升所有依赖
shamefullyHoist: true

# 在执行脚本时使用POSIX shell模拟器替代系统原生shell
shellEmulator: true

# 用于控制是否严格检查对等依赖（peer dependencies）的版本一致性。
# 当设置为 true 时，pnpm 会强制安装指定版本的对等依赖；
# 设置为 false 时，会忽略版本不一致的警告
strictPeerDependencies: false

# 当设置为“禁止降级”时，如果软件包的信任级别较之前的版本有所降低，pnpm 将无法安装
trustPolicy: no-downgrade

# 列出一个或多个 pnpm 应该允许安装的特定软件包或版本，即使这些软件包不满足信任策略要求。
trustPolicyExclude:
  - semver
  - chokidar
  - cached-factory
  - undici

packages:
  - packages/*

catalogs:
  prod:
    '@lincy/markdown-it-toc-and-anchor': ^5.0.0
    '@lincy/utils': ^0.7.3
    axios: ^1.21.1
    cheerio: 1.0.0
    compression: ^1.8.2
    cookie-parser: ^1.4.7
    dayjs: ^1.11.23
    express: ^5.3.0
    express-validator: ^7.3.2
    highlight.js: ^11.12.0
    jsonwebtoken: ^9.0.3
    lru-cache: ^11.5.3
    markdown-it: ^15.0.3
    markdown-it-toc-and-anchor: ^4.2.0
    md5: ^2.3.0
    mockjs: ^1.1.0
    mongoose: 8.7.3
    mongoose-autopopulate: ^1.2.1
    morgan: ^1.12.1
    multer: ^2.5.0
    qiniu: ^7.15.2
    request-ip: ^3.3.0
    serve-favicon: ^2.5.1
    tslib: ^2.9.1
    twig: ^3.0.0

  lint:
    '@lincy/eslint-config': ^8.0.1
    eslint: ^10.14.0

  types:
    '@types/supertest': ^7.2.1
    '@types/compression': ^1.8.1
    '@types/cookie-parser': ^1.4.10
    '@types/express': ^5.0.6
    '@types/jsonwebtoken': ^9.0.10
    '@types/markdown-it': ^14.2.0
    '@types/md5': ^2.3.6
    '@types/mockjs': ^1.0.10
    '@types/morgan': ^1.9.10
    '@types/multer': ^2.3.0
    '@types/node': ^26.6.6
    '@types/request-ip': ^0.0.41
    '@types/serve-favicon': ^2.5.7

  dev:
    supertest: ^7.3.2
    concurrently: ^10.0.7
    jiti: ^2.7.0
    nodemon: ^3.1.14
    tsc-alias: ^1.9.10
    tsx: ^4.23.15
    typescript: ^6.0.3
    vitest: ^5.1.0

peerDependencyRules:
  ignoreMissing:
    - prettier

allowBuilds:
  better-sqlite3: true
  esbuild: true
